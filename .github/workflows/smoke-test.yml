name: Hangeul Design Tests

on:
  push:
  pull_request:

jobs:
  minimum-streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared minimum
        run: |
          python -m pip install --upgrade pip
          python -m pip install "streamlit==1.55.0" "pytest>=8,<9"
      - name: Regression tests at minimum
        run: python -m pytest -q
      - name: Unified app interaction test at minimum
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app_cinematic.py", default_timeout=20)
          at.run()
          assert not at.exception, at.exception
          at.text_input(key="beginner_subject").set_value("햄치즈 베이글 신메뉴")
          at.selectbox(key="beginner_destination").set_value("릴스 / 틱톡 / 유튜브 쇼츠")
          at.button(key="beginner_apply").click().run()
          assert not at.exception, at.exception
          assert at.session_state["preset"] == "숏폼 바이럴"
          assert at.session_state["work_mode"] == "숏폼 영상 (Short-form Video)"
          assert at.session_state["aspect"] == "9:16"
          at.run()
          assert not at.exception, at.exception
          print("unified beginner-click AppTest OK")
          PY

  supported-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install supported dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Regression tests
        run: python -m pytest -q
      - name: Unified app interaction test
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app_cinematic.py", default_timeout=20)
          at.run()
          assert not at.exception, at.exception
          at.text_input(key="beginner_subject").set_value("햄치즈 베이글 신메뉴")
          at.selectbox(key="beginner_destination").set_value("릴스 / 틱톡 / 유튜브 쇼츠")
          at.button(key="beginner_apply").click().run()
          assert not at.exception, at.exception
          assert at.session_state["preset"] == "숏폼 바이럴"
          assert at.session_state["work_mode"] == "숏폼 영상 (Short-form Video)"
          assert at.session_state["aspect"] == "9:16"
          at.run()
          assert not at.exception, at.exception
          print("unified beginner-click AppTest OK")
          PY
