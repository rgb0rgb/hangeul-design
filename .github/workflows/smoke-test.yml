name: Hangeul Design Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -m pytest -q

      - name: Streamlit AppTest - Hangeul Design
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app_reference.py", default_timeout=15).run()
          assert not at.exception, at.exception
          print("app_reference AppTest OK")
          PY

      - name: Streamlit AppTest - Cinematic
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app_cinematic.py", default_timeout=15).run()
          assert not at.exception, at.exception
          print("app_cinematic AppTest OK")
          PY
