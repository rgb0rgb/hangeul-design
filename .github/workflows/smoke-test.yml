name: Hangeul Design Tests

on:
  push:
  pull_request:

jobs:
  minimum-streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install declared minimum
        run: |
          python -m pip install --upgrade pip
          python -m pip install "streamlit==1.55.0" "pytest>=8,<9"
      - name: Regression tests at minimum
        run: python -m pytest -q
      - name: AppTest twice at minimum
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          for filename in ("app_reference.py", "app_cinematic.py"):
              at = AppTest.from_file(filename, default_timeout=20)
              at.run()
              assert not at.exception, (filename, at.exception)
              at.run()
              assert not at.exception, (filename, at.exception)
              print(filename, "two-run AppTest OK")
          PY

  supported-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install supported dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Regression tests
        run: python -m pytest -q
      - name: AppTest twice
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          for filename in ("app_reference.py", "app_cinematic.py"):
              at = AppTest.from_file(filename, default_timeout=20)
              at.run()
              assert not at.exception, (filename, at.exception)
              at.run()
              assert not at.exception, (filename, at.exception)
              print(filename, "two-run AppTest OK")
          PY
